<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05070b">
  <title>24/7 Live TV</title>
  <link rel="stylesheet" href="/live.css">
</head>
<body>
  <main class="channel-shell" id="channelShell">
    <div class="video-stage">
      <video id="liveVideo" autoplay muted playsinline preload="auto" disablepictureinpicture controlslist="nodownload noplaybackrate noremoteplayback" tabindex="-1"></video>
      <div class="video-vignette"></div>

      <div class="offline-state" id="offlineState" hidden>
        <div class="offline-mark">24/7</div>
        <h1>Channel standby</h1>
        <p>The live feed will begin automatically when programming is available.</p>
      </div>

      <header class="channel-topbar">
        <div class="brand-lockup">
          <span class="brand-orb"></span>
          <div>
            <strong id="channelName">24/7 LIVE</strong>
            <span id="channelTagline">Always on. Always live.</span>
          </div>
        </div>
        <div class="live-pill"><span></span> LIVE</div>
      </header>

      <section class="now-card" id="nowCard" hidden>
        <div class="now-copy">
          <span class="eyebrow">ON NOW</span>
          <h1 id="nowTitle">Loading channel…</h1>
          <p id="nextTitle">Up next</p>
        </div>
        <div class="viewer-actions">
          <button class="action-button" id="soundButton" type="button" aria-label="Turn sound on">
            <span id="soundIcon">Sound on</span>
          </button>
          <button class="action-button" id="fullscreenButton" type="button" aria-label="Enter fullscreen">Fullscreen</button>
        </div>
      </section>

      <div class="connection-badge" id="connectionBadge" hidden>Reconnecting to live feed…</div>
    </div>
  </main>
  <script src="/live.js" defer></script>
</body>
</html>
